# /etc/nginx/sites-available/turistabybonestar.conf — versión SOLO HTTP para el primer arranque.
# Cuando el dominio apunte al servidor, `sudo certbot --nginx -d turistabybonestar.com -d www.turistabybonestar.com`
# añade el bloque HTTPS y la redirección (el resultado final equivale a deploy/nginx.conf).
server {
    listen 80;
    server_name turistabybonestar.com www.turistabybonestar.com;

    client_max_body_size 20m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /media/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=604800";
    }
    # Imágenes subidas desde el admin (volumen ./data/uploads de docker-compose).
    location /uploads/ {
        alias /opt/turistabybonestar/turistabybonestarV2/data/uploads/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
