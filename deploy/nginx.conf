# /etc/nginx/sites-available/turistabybonestar.conf
# Proxy inverso hacia el contenedor Next.js (puerto 3000). TLS con certbot.
server {
    listen 80;
    server_name turistabybonestar.com www.turistabybonestar.com;
    return 301 https://turistabybonestar.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name turistabybonestar.com;

    ssl_certificate     /etc/letsencrypt/live/turistabybonestar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/turistabybonestar.com/privkey.pem;

    client_max_body_size 20m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Assets con hash: cache larga
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /media/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
